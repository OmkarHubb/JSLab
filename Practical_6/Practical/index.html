<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String and Email Operations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Reverse a Paragraph</h2>

        <textarea id="paragraph" placeholder="Enter a paragraph"></textarea>

        <button onclick="reversedParagraph()">Reverse Paragraph</button>

        <p id="result"></p>


        <hr>


        <h2>Email Validation</h2>

        <input type="text" id="email" placeholder="Enter your email">

        <button onclick="validateEmail()">Verify Email</button>

        <p id="emailResult"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
