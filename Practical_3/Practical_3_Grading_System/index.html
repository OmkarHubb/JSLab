<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Grading System</title>
    <meta name="description" content="A premium student grading system to calculate grades based on marks." />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Animated background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="card">
        <!-- Header -->
        <div class="card-header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                    <path d="M6 12v5c0 2 4 3 6 3s6-1 6-3v-5" />
                </svg>
            </div>
            <h1>Student Grading System</h1>
            <p class="subtitle">Fill in the student details below to calculate the final grade</p>
        </div>

        <!-- Form Grid -->
        <div class="form-grid">
            <div class="form-group">
                <label for="studentName">
                    <span class="label-icon">👤</span> Student Name
                </label>
                <input type="text" id="studentName" placeholder="e.g. Omkar Sharma" />
            </div>

            <div class="form-group">
                <label for="prn">
                    <span class="label-icon">🆔</span> PRN / Roll Number
                </label>
                <input type="text" id="prn" placeholder="e.g. 2024001234" />
            </div>

            <div class="form-group">
                <label for="subject">
                    <span class="label-icon">📚</span> Subject
                </label>
                <input type="text" id="subject" placeholder="e.g. Web Technology" />
            </div>

            <div class="form-group">
                <label for="semester">
                    <span class="label-icon">🎓</span> Semester
                </label>
                <select id="semester">
                    <option value="" disabled selected>Select semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="marks">
                    <span class="label-icon">📝</span> Total Marks (0 – 100)
                </label>
                <input type="number" id="marks" min="0" max="100" placeholder="e.g. 85" />
            </div>
        </div>

        <button type="button" class="btn" id="gradeBtn">
            <span class="btn-text">Calculate Grade</span>
            <span class="btn-shine"></span>
        </button>

        <!-- Result card -->
        <div class="msg" id="gradeResult"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
