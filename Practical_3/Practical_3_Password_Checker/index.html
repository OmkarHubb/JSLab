<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="card">
        <h1>Student Registration</h1>
        <p class="subtitle">Create your account</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required />
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required />
            </div>

            <ul class="rules-list" id="rulesList">
                <li id="ruleLength"><span class="dot"></span> At least 8 characters</li>
                <li id="ruleUpper"><span class="dot"></span> At least one uppercase letter (A–Z)</li>
                <li id="ruleLower"><span class="dot"></span> At least one lowercase letter (a–z)</li>
                <li id="ruleDigit"><span class="dot"></span> At least one digit (0–9)</li>
                <li id="ruleSpecial"><span class="dot"></span> At least one special character (!@#$%^&*)</li>
                <li id="ruleMatch"><span class="dot"></span> Passwords match</li>
            </ul>

            <button type="submit" class="btn" id="submitBtn">Register</button>

            <div class="msg msg-success" id="successMsg">✔ Registration successful!</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
