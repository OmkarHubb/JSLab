<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <meta name="description" content="A beautiful palindrome checker to verify if a word or phrase reads the same forwards and backwards.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0f2fe, #fce7f3, #fef3c7, #dcfce7);
            background-size: 400% 400%;
            animation: bgShift 14s ease infinite;
            color: #1e293b;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        @keyframes bgShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #38bdf8, transparent 70%);
            top: -10%;
            right: -5%;
            animation: float1 11s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #f472b6, transparent 70%);
            bottom: -8%;
            left: -5%;
            animation: float2 13s ease-in-out infinite alternate;
        }

        .orb-3 {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, #fbbf24, transparent 70%);
            top: 55%;
            left: 60%;
            animation: float3 15s ease-in-out infinite alternate;
        }

        @keyframes float1 { to { transform: translate(-40px, 60px) scale(1.1); } }
        @keyframes float2 { to { transform: translate(50px, -40px) scale(1.15); } }
        @keyframes float3 { to { transform: translate(-50px, -30px) scale(0.9); } }

        /* Card */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            box-shadow: 0 24px 60px -15px rgba(0, 0, 0, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.5);
            padding: 48px 42px 42px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: cardEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.97);
        }

        @keyframes cardEntry {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header icon */
        .header-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
            box-shadow: 0 10px 28px -6px rgba(59, 130, 246, 0.45);
            font-size: 1.7rem;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9, #6366f1, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        p.desc {
            font-size: 0.92rem;
            color: #64748b;
            margin-bottom: 32px;
            font-weight: 300;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .label-icon {
            font-size: 1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.05rem;
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 1.5px;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            background: #fff;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
            letter-spacing: 1.5px;
        }

        /* Letter visualization */
        .letter-display {
            display: flex;
            justify-content: center;
            gap: 6px;
            min-height: 48px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .letter-box {
            width: 40px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            animation: letterPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.5) translateY(10px);
        }

        .letter-box.match {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #059669;
            border: 1.5px solid #6ee7b7;
        }

        .letter-box.no-match {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #dc2626;
            border: 1.5px solid #fca5a5;
        }

        .letter-box.neutral {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            color: #0284c7;
            border: 1.5px solid #7dd3fc;
        }

        @keyframes letterPop {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Mirror label */
        .mirror-label {
            font-size: 0.78rem;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: none;
        }

        .mirror-label.show {
            display: block;
        }

        /* Button */
        button {
            display: block;
            width: 100%;
            padding: 15px 0;
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 1.08rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px -8px rgba(59, 130, 246, 0.5);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .btn-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.6s ease;
        }

        button:hover .btn-shine { left: 100%; }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px -6px rgba(59, 130, 246, 0.6);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        /* Result */
        .result {
            margin-top: 24px;
            padding: 18px 20px;
            border-radius: 16px;
            display: none;
            font-weight: 600;
            font-size: 1.05rem;
            animation: resultPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes resultPop {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .result.success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(56, 189, 248, 0.06));
            color: #059669;
            border: 1.5px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 8px 24px -8px rgba(16, 185, 129, 0.12);
            display: block;
        }

        .result.error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.06), rgba(249, 115, 22, 0.04));
            color: #dc2626;
            border: 1.5px solid rgba(239, 68, 68, 0.25);
            box-shadow: 0 8px 24px -8px rgba(239, 68, 68, 0.1);
            display: block;
        }

        .result .result-emoji {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 6px;
        }

        /* History */
        .history-section {
            margin-top: 28px;
            text-align: left;
            display: none;
        }

        .history-section.show {
            display: block;
            animation: resultPop 0.4s ease forwards;
        }

        .history-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 0.88rem;
            animation: letterPop 0.3s ease forwards;
            opacity: 0;
        }

        .history-item .word {
            font-weight: 600;
            color: #334155;
            letter-spacing: 0.5px;
        }

        .history-item .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .badge.yes {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #059669;
        }

        .badge.no {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #dc2626;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .container {
                padding: 36px 24px 32px;
            }
            h2 { font-size: 1.5rem; }
            .letter-box { width: 32px; height: 36px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Animated orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="header-icon">🔄</div>
        <h2>Palindrome Checker</h2>
        <p class="desc">Check if a word reads the same forwards & backwards</p>

        <div class="form-group">
            <label>
                <span class="label-icon">✏️</span> Enter a word or phrase
            </label>
            <input type="text" id="palindromeInput" placeholder="e.g. racecar" oninput="showLiveLetters()" />
        </div>

        <!-- Live letter visualization -->
        <p class="mirror-label" id="mirrorLabel">↕ Letter Mirror</p>
        <div class="letter-display" id="letterDisplay"></div>

        <button onclick="checkPalindrome()">
            <span class="btn-text">Check Palindrome</span>
            <span class="btn-shine"></span>
        </button>

        <div id="palResult" class="result"></div>

        <!-- History -->
        <div class="history-section" id="historySection">
            <div class="history-title">📋 Recent Checks</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script src="script_f.js"></script>
    <script>
        // Live letter preview as user types
        function showLiveLetters() {
            const input = document.getElementById('palindromeInput').value.trim();
            const display = document.getElementById('letterDisplay');
            const label = document.getElementById('mirrorLabel');

            if (!input) {
                display.innerHTML = '';
                label.classList.remove('show');
                return;
            }

            label.classList.add('show');
            const cleaned = input.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
            const reversed = cleaned.split('').reverse().join('');

            let html = '';
            for (let i = 0; i < cleaned.length; i++) {
                const match = cleaned[i] === reversed[i];
                const delay = i * 40;
                html += `<div class="letter-box neutral" style="animation-delay: ${delay}ms">${cleaned[i]}</div>`;
            }
            display.innerHTML = html;
        }

        // Override to add visual letter coloring + history
        const _originalCheck = checkPalindrome;
        checkPalindrome = function () {
            _originalCheck();

            const input = document.getElementById('palindromeInput').value.trim();
            if (!input) return;

            const cleaned = input.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
            const reversed = cleaned.split('').reverse().join('');
            const isPal = cleaned === reversed;
            const display = document.getElementById('letterDisplay');

            // Color the letters
            let html = '';
            for (let i = 0; i < cleaned.length; i++) {
                const cls = cleaned[i] === reversed[i] ? (isPal ? 'match' : 'no-match') : 'no-match';
                const delay = i * 50;
                html += `<div class="letter-box ${cls}" style="animation-delay: ${delay}ms">${cleaned[i]}</div>`;
            }
            display.innerHTML = html;

            // Update result with emoji
            const resultDiv = document.getElementById('palResult');
            if (isPal) {
                resultDiv.innerHTML = `<span class="result-emoji">🎉</span> "${input}" is a palindrome!`;
            } else {
                resultDiv.innerHTML = `<span class="result-emoji">❌</span> "${input}" is not a palindrome.`;
            }

            // Add to visual history
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');
            historySection.classList.add('show');

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <span class="word">${input}</span>
                <span class="badge ${isPal ? 'yes' : 'no'}">${isPal ? '✓ Yes' : '✗ No'}</span>
            `;
            historyList.prepend(item);

            // Keep only last 5
            while (historyList.children.length > 5) {
                historyList.removeChild(historyList.lastChild);
            }
        };
    </script>
</body>
</html>
