<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Billing Calculator</title>
</head>
<body>

    <h1>Billing Calculator</h1>

    <label>Customer Name:</label>
    <input type="text" id="name"><br><br>

    <label>Product Name:</label>
    <input type="text" id="product"><br><br>

    <label>Price per Item:</label>
    <input type="number" id="price" step="0.01"><br><br>

    <label>Quantity:</label>
    <input type="number" id="quantity"><br><br>

    <button onclick="calculateBill()">Generate Bill</button>

    <hr>

    <div id="bill"></div>

    <script src="script.js"></script>

</body>
</html>
