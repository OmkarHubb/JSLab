<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Countdown Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Class Scheduler</h1>
        <p class="subtitle">Never miss a class.</p>

        <div class="card">
            <label for="className">Class Name</label>
            <input type="text" id="className" placeholder="e.g. JavaScript" required>

            <label for="minutes">Class starts in (minutes)</label>
            <input type="number" id="minutes" placeholder="e.g. 15" min="1" max="1440">

            <button id="startBtn">Start Timer</button>
            <button id="resetBtn" class="reset">Reset</button>

            <div class="countdown">
                <p id="status">Waiting to start</p>
                <div id="timer">00:00</div>
                <h2 id="displayClass">No class selected</h2>
            </div>
        </div>
    </div>

    <script type="module">
        import { initScheduler } from './script.js';
        initScheduler();
    </script>
</body>

</html>
