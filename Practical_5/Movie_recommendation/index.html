<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Movie Watchlist Analyzer</h1>
        <p class="subtitle">Manage your watchlist using JavaScript arrays</p>

        <div class="input-section">
            <input type="text" id="movieName" placeholder="Movie name">
            <input type="number" id="movieRating" placeholder="Rating (1-10)" min="1" max="10">
            <input type="number" id="movieYear" placeholder="Release year">

            <button onclick="addMovie()">Add Movie</button>
        </div>

        <div class="controls">
            <button onclick="removeLast()">POP - Remove Last</button>
            <button onclick="removeFirst()">SHIFT - Remove First</button>
            <button onclick="addFirst()">UNSHIFT - Add to Beginning</button>
            <button onclick="removeMovie()">SPLICE - Remove Selected</button>
        </div>

        <h2>Current Watchlist</h2>
        <div id="movieList"></div>

        <div class="analysis">
            <h2>Watchlist Analysis</h2>

            <button onclick="showMap()">MAP - Movie Titles</button>
            <button onclick="showFilter()">FILTER - Highly Rated</button>
            <button onclick="showReduce()">REDUCE - Average Rating</button>
            <button onclick="showForEach()">forEach - Display Movies</button>
            <button onclick="showSlice()">SLICE - First 3 Movies</button>

            <div id="result"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
