<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Form | SIT</title>
    <meta name="description" content="Student application form for SIT - Submit your information easily.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        function showWelcome() {
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let number = document.getElementById("number").value;
            let email = document.getElementById("email").value;
            let address = document.getElementById("address").value;

            // Simple validation
            if (!name || !age || !number || !email || !address) {
                alert("Please fill in all fields.");
                return;
            }

            const outputDiv = document.getElementById("output");
            outputDiv.innerHTML =
                '<div class="result-card">' +
                "<h2>Welcome, " + name + "!</h2>" +
                "<p><strong>Age:</strong> " + age + "</p>" +
                "<p><strong>Phone:</strong> " + number + "</p>" +
                "<p><strong>Email:</strong> " + email + "</p>" +
                "<p><strong>Address:</strong> " + address + "</p>" +
                "</div>";
            outputDiv.classList.add("show");

            console.log("User Name:", name);
            console.info("User Age:", age);
            console.log("Phone Number:", number);
            console.log("Email:", email);
            console.log("Address:", address);
            console.warn("This is a warning message");
            console.error("This is an error message");
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>Student Application Form</h1>
                <p>Please fill in your details below</p>
            </div>

            <form onsubmit="event.preventDefault(); showWelcome(); greet();">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="e.g. Omkar Patil" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="e.g. 20" min="1" max="100" required>
                </div>

                <div class="form-group">
                    <label for="number">Phone Number</label>
                    <input type="tel" id="number" placeholder="e.g. 9876543210" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. omkar@example.com" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" rows="3" placeholder="Enter your full address" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Application</button>
            </form>

            <div id="output"></div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>

</html>
