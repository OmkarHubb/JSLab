<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Employee Management</h1>
        
        <div class="form-section">
            <h2>Add New Employee</h2>
            <form id="employeeForm">
                <div class="form-group">
                    <label for="empId">Employee ID:</label>
                    <input type="text" id="empId" placeholder="e.g. E104" required>
                </div>
                <div class="form-group">
                    <label for="empName">Employee Name:</label>
                    <input type="text" id="empName" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label for="empDept">Department:</label>
                    <input type="text" id="empDept" placeholder="e.g. Sales" required>
                </div>
                <div class="form-group">
                    <label for="empSalary">Salary:</label>
                    <input type="number" id="empSalary" placeholder="e.g. 50000" required>
                </div>
                <button type="submit" class="btn-primary">Add Employee</button>
            </form>
        </div>

        <div class="table-section">
            <div class="table-header">
                <h2>Employee Directory</h2>
                <button id="loadBtn" class="btn-secondary">Load Employees</button>
            </div>
            
            <table id="employeeTable">
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Data will be inserted here dynamically -->
                </tbody>
            </table>
        </div>
        
        <div id="jsonOutputBox" class="json-output">
            <h3>Latest JSON Output</h3>
            <p>Object converted using <code>JSON.stringify()</code>:</p>
            <pre id="jsonDisplay"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
